name: .NET build
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore UTMMonitor/UTMMonitor.csproj -r win-x64
      - run: dotnet build UTMMonitor/UTMMonitor.csproj -c Release --no-restore
      - run: dotnet publish UTMMonitor/UTMMonitor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --no-restore -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: UTM-Monitor-win-x64
          path: publish/
