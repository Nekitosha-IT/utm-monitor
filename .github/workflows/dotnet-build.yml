name: UTM Monitor release

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Version: $version"

      - name: Restore
        run: dotnet restore UTMMonitor/UTMMonitor.csproj -r win-x64

      - name: Build
        run: dotnet build UTMMonitor/UTMMonitor.csproj -c Release --no-restore -p:Version=$env:APP_VERSION -p:AssemblyVersion=$env:APP_VERSION.0 -p:FileVersion=$env:APP_VERSION.0

      - name: Publish single EXE
        run: dotnet publish UTMMonitor/UTMMonitor.csproj -c Release -r win-x64 --self-contained true --no-restore -p:Version=$env:APP_VERSION -p:AssemblyVersion=$env:APP_VERSION.0 -p:FileVersion=$env:APP_VERSION.0 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Verify and package
        shell: pwsh
        run: |
          $exe = Get-Item 'publish/UTM Monitor.exe' -ErrorAction Stop
          if ($exe.Length -lt 50MB) { throw "Published EXE looks invalid: $($exe.Length) bytes" }

          $sha = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'publish/UTM Monitor.exe.sha256' -Value "$sha  UTM Monitor.exe" -Encoding ascii

          Compress-Archive -Path 'publish/UTM Monitor.exe','publish/UTM Monitor.exe.sha256' -DestinationPath "publish/UTM-Monitor-win-x64-$env:APP_VERSION.zip" -CompressionLevel Optimal -Force

          Write-Host "EXE: $($exe.FullName)"
          Write-Host "SIZE: $($exe.Length) bytes"
          Write-Host "SHA256: $sha"
          Write-Host "VERSION: $env:APP_VERSION"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: UTM-Monitor-win-x64-${{ env.APP_VERSION }}
          path: |
            publish/UTM Monitor.exe
            publish/UTM Monitor.exe.sha256

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: UTM-Monitor-package-${{ env.APP_VERSION }}
          path: publish/UTM-Monitor-win-x64-${{ env.APP_VERSION }}.zip

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: UTM Monitor ${{ env.APP_VERSION }}
          generate_release_notes: true
          files: |
            publish/UTM Monitor.exe
            publish/UTM Monitor.exe.sha256
            publish/UTM-Monitor-win-x64-${{ env.APP_VERSION }}.zip
